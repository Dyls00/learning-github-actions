name: Job SQL Order

on:
  workflow_dispatch:

jobs:
  run-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Initialiser la base de donnees
        run: sqlite3 base_test.db < sql/init_orders.sql

      - name : Transformer les commandes
        run : sqlite3 base_test.db < sql/clean_orders.sql